name: Publish Reboil

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm ci --prefix docs-site
      - run: node scripts/check-reboil-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm run check:release
      - run: npm publish --workspace @reboil/store
