<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/boil.png" />
    <title>Reboil — Vanilla JavaScript</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Reboil</a>
      <nav aria-label="Primary navigation">
        <a href="">Documentation</a>
        <a href="">Github</a>
      </nav>
    </header>

    <main class="hero" id="demo">
      <section class="demo" aria-label="Reboil code example">
        <div class="code-window">
          <div class="window-bar">
            <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <span id="code-filename">src/main.jsx</span>
          </div>
          <pre><code id="code-example"></code></pre>
          <template id="javascript-example"
            ><span class="keyword">import</span> { <span class="imported">createStore</span> }
            <span class="keyword">from</span> <span class="string">'reboil'</span>

            <span class="keyword">const</span> { <span class="variable">store</span> } =
            <span class="function">createStore</span>({ <span class="property">count</span>:
            <span class="number">1</span>, })

            <span class="keyword">const</span> <span class="variable">count</span> =
            <span class="object">document</span>.<span class="property">querySelector</span>(<span class="string"
              >'#count'</span
            >) <span class="keyword">const</span> <span class="variable">increment</span> =
            <span class="object">document</span>.<span class="property">querySelector</span>(<span class="string"
              >'#increment'</span
            >)

            <span class="object">store</span>.<span class="property">subscribe</span>(<span class="string">'count'</span
            >, (<span class="variable">value</span>, <span class="variable">lastValue</span>) =&gt; {
            <span class="variable">count</span>.<span class="property">textContent</span> =
            <span class="variable">value</span>
            })

            <span class="variable">increment</span>.<span class="property">onclick</span> = () =&gt; {
            <span class="object">store</span>.<span class="property">set</span>(<span class="string">'count'</span>,
            <span class="variable">value</span> =&gt; <span class="variable">value</span> +
            <span class="number">1</span>) }</template
          >
          <template id="typescript-example"
            ><span class="keyword">import</span> { <span class="imported">createStore</span> }
            <span class="keyword">from</span> <span class="string">'reboil'</span>

            <span class="keyword">type</span> State = { <span class="property">count</span>:
            <span class="type">number</span>
            }

            <span class="keyword">const</span> { <span class="variable">store</span> } =
            <span class="function">createStore</span>&lt;State&gt;({ <span class="property">count</span>:
            <span class="number">1</span>, })

            <span class="keyword">const</span> <span class="variable">count</span> =
            <span class="object">document</span>.<span class="property">querySelector</span>&lt;HTMLElement&gt;(<span
              class="string"
              >'#count'</span
            >)! <span class="keyword">const</span> <span class="variable">increment</span> =
            <span class="object">document</span>.<span class="property">querySelector</span
            >&lt;HTMLButtonElement&gt;(<span class="string">'#increment'</span>)!

            <span class="object">store</span>.<span class="property">subscribe</span>(<span class="string">'count'</span
            >, (<span class="variable">value</span>, <span class="variable">lastValue</span>) =&gt; {
            <span class="variable">count</span>.<span class="property">textContent</span> = String(<span
              class="variable"
              >value</span
            >) })

            <span class="variable">increment</span>.<span class="property">onclick</span> = () =&gt; {
            <span class="object">store</span>.<span class="property">set</span>(<span class="string">'count'</span>,
            <span class="variable">value</span> =&gt; <span class="variable">value</span> +
            <span class="number">1</span>) }</template
          >
        </div>

        <div class="code-controls">
          <label class="sr-only" for="language">Code language</label>
          <select id="language">
            <option value="typescript">TypeScript</option>
            <option value="javascript">JavaScript</option>
          </select>
          <button id="copy-code" class="copy-button" type="button" aria-label="Copy code" title="Copy code">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="8" y="8" width="11" height="11" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
            </svg>
            <span class="sr-only">Copy code</span>
          </button>
        </div>

        <aside class="counter-card" aria-label="Live counter">
          <div class="counter-heading">
            <span class="counter-label">count</span>
            <span id="last-change" class="counter-note" aria-live="polite"></span>
          </div>
          <strong id="count">1</strong>
          <button id="increment" type="button">one up</button>
          <button id="reset" class="reset-link" type="button">reset</button>
        </aside>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
